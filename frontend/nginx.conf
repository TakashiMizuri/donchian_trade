server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Static instance catalog for the dashboard switcher (no auth).
    location = /api/instances {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"instances":[{"id":"a","name":"main","prefix":"/api/a"},{"id":"b","name":"alt","prefix":"/api/b"}]}';
    }

    location /api/a/ {
        proxy_pass http://bot_a:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/b/ {
        proxy_pass http://bot_b:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy single-bot path → instance a (bookmarks / old clients).
    location /api/ {
        proxy_pass http://bot_a:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
